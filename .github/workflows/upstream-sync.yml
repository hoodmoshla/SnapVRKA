name: Upstream Sync

# Watches the original project (MaverickRox/VRKA-Android) and merges new releases, tags or
# commits into SnapVRKA without ever dropping SnapVRKA's own changes.
#
#   detect upstream  ->  merge  ->  verify SnapVRKA identity  ->  tests  ->  bump version
#        ->  push  ->  (android-release.yml builds, signs, verifies and publishes the release)
#
# It is idempotent: the last merged upstream commit is recorded in .snapvrka/upstream-sync.json, so
# running it again with no new upstream work exits without touching anything.

on:
  schedule:
    # Daily at 04:17 UTC.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "SnapVRKA branch to sync into (empty = value from .snapvrka/upstream-sync.json)"
        required: false
        default: ""
      force:
        description: "Continue even when no new upstream commit is detected"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: snapvrka-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Detect, merge and publish upstream updates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync state
        id: state
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh

          UPSTREAM_REPO="$(.github/scripts/sync-state.sh get upstreamRepository)"
          UPSTREAM_BRANCH="$(.github/scripts/sync-state.sh get upstreamBranch)"
          TARGET_BRANCH="$(.github/scripts/sync-state.sh get targetBranch)"
          LAST_SYNCED="$(.github/scripts/sync-state.sh get lastSyncedCommit)"

          if [ -n "${{ inputs.target_branch }}" ]; then
            TARGET_BRANCH="${{ inputs.target_branch }}"
          fi

          if [ -z "$UPSTREAM_REPO" ] || [ -z "$UPSTREAM_BRANCH" ] || [ -z "$TARGET_BRANCH" ]; then
            echo "::error::Incomplete sync state in .snapvrka/upstream-sync.json"
            exit 1
          fi

          {
            echo "upstream_repo=$UPSTREAM_REPO"
            echo "upstream_branch=$UPSTREAM_BRANCH"
            echo "target_branch=$TARGET_BRANCH"
            echo "last_synced=$LAST_SYNCED"
          } >> "$GITHUB_OUTPUT"

          echo "upstream : $UPSTREAM_REPO@$UPSTREAM_BRANCH"
          echo "target   : $TARGET_BRANCH"
          echo "last sync: ${LAST_SYNCED:-<none>}"

      - name: Detect upstream updates (commits, tags and releases)
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ steps.state.outputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ steps.state.outputs.upstream_branch }}
          TARGET_BRANCH: ${{ steps.state.outputs.target_branch }}
          LAST_SYNCED: ${{ steps.state.outputs.last_synced }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # A scheduled run checks out the repository default branch, but the "already synced"
          # test must run against the branch that actually carries SnapVRKA. Otherwise the
          # ancestor check would compare against the wrong tree on every run.
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          HEAD_SHA="$(git rev-parse HEAD)"

          # Newest upstream release/tag, used for the notes and for release-driven detection.
          LATEST_RELEASE_TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")"

          HAS_UPDATE="true"
          REASON="new upstream commits"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            HAS_UPDATE="false"
            REASON="upstream ${UPSTREAM_SHA:0:8} is already contained in this branch"
          elif [ -n "$LAST_SYNCED" ] && [ "$UPSTREAM_SHA" = "$LAST_SYNCED" ]; then
            HAS_UPDATE="false"
            REASON="upstream is unchanged since the last recorded sync"
          fi

          if [ "${FORCE:-false}" = "true" ]; then
            HAS_UPDATE="true"
            REASON="forced run"
          fi

          NEW_COMMITS="$(git rev-list --count "HEAD..${UPSTREAM_SHA}" 2>/dev/null || echo 0)"

          {
            echo "has_update=$HAS_UPDATE"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "latest_release_tag=$LATEST_RELEASE_TAG"
            echo "new_commits=$NEW_COMMITS"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          echo "upstream head : $UPSTREAM_SHA"
          echo "branch head   : $HEAD_SHA"
          echo "new commits   : $NEW_COMMITS"
          echo "upstream latest release: ${LATEST_RELEASE_TAG:-<none>}"
          echo "update        : $HAS_UPDATE ($REASON)"

      - name: Nothing to sync
        if: steps.upstream.outputs.has_update != 'true'
        run: |
          echo "SnapVRKA is already in sync with ${{ steps.state.outputs.upstream_repo }}@${{ steps.state.outputs.upstream_branch }}."
          echo "Reason: ${{ steps.upstream.outputs.reason }}"
          echo "No merge, no build, no APK and no release were produced."

      - name: Set up JDK 17 (Temurin)
        if: steps.upstream.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.upstream.outputs.has_update == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        if: steps.upstream.outputs.has_update == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install required SDK packages
        if: steps.upstream.outputs.has_update == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Merge upstream and verify SnapVRKA identity
        if: steps.upstream.outputs.has_update == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          TARGET_BRANCH: ${{ steps.state.outputs.target_branch }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh

          git config user.name "snapvrka-sync"
          git config user.email "snapvrka-sync@users.noreply.github.com"

          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          # Snapshot of our identity before the merge, so a regression can be spotted immediately.
          .github/scripts/verify-snapvrka-identity.sh

          echo "--- merging upstream $UPSTREAM_SHA ---"
          if ! git merge --no-ff --no-commit "$UPSTREAM_SHA"; then
            echo "::error::Merge conflict while syncing upstream $UPSTREAM_SHA into $TARGET_BRANCH."
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U || true
            echo ""
            echo "Upstream commit : $UPSTREAM_SHA"
            echo "SnapVRKA branch : $TARGET_BRANCH ($(git rev-parse HEAD))"
            echo "Resolve manually, keeping the SnapVRKA behaviour and re-applying the upstream logic."
            echo "No APK and no release were produced."
            git merge --abort || true
            exit 1
          fi

          echo "--- verifying SnapVRKA changes survived the merge ---"
          .github/scripts/verify-snapvrka-identity.sh

      - name: Run the test suite on the merged tree
        if: steps.upstream.outputs.has_update == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Bump the SnapVRKA version
        if: steps.upstream.outputs.has_update == 'true'
        id: version
        run: .github/scripts/bump-version.sh app/build.gradle.kts

      - name: Record the sync state
        if: steps.upstream.outputs.has_update == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          .github/scripts/sync-state.sh set \
            lastSyncedCommit "$UPSTREAM_SHA" \
            lastSyncedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            snapvrkaVersionName "$VERSION_NAME" \
            snapvrkaVersionCode "$VERSION_CODE"

      - name: Commit and push the sync
        if: steps.upstream.outputs.has_update == 'true'
        env:
          TARGET_BRANCH: ${{ steps.state.outputs.target_branch }}
          UPSTREAM_REPO: ${{ steps.state.outputs.upstream_repo }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          NEW_COMMITS: ${{ steps.upstream.outputs.new_commits }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          git add -A
          git commit -m "Sync upstream ${UPSTREAM_REPO}@${UPSTREAM_SHA:0:8} and bump to v${VERSION_NAME} (${VERSION_CODE})"

          git push origin "HEAD:$TARGET_BRANCH"

          echo "Pushed the merged tree to $TARGET_BRANCH."
          echo "android-release.yml now builds, signs, verifies and publishes SnapVRKA v${VERSION_NAME}."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Upstream Sync"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream | \`${{ steps.state.outputs.upstream_repo }}@${{ steps.state.outputs.upstream_branch }}\` |"
            echo "| Upstream commit | \`${{ steps.upstream.outputs.upstream_sha }}\` |"
            echo "| New commits | ${{ steps.upstream.outputs.new_commits }} |"
            echo "| Update detected | ${{ steps.upstream.outputs.has_update }} |"
            echo "| Reason | ${{ steps.upstream.outputs.reason }} |"
            echo "| Target branch | \`${{ steps.state.outputs.target_branch }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
