name: Upstream Sync

# Detects changes in MaverickRox/VRKA-Android and writes a review report only.
# It never merges, commits, pushes, bumps a version, builds an APK, or publishes a release.
# lastSyncedCommit is intentionally left untouched here: it may change only after a separately
# reviewed and successfully completed sync.

on:
  schedule:
    # Daily at 04:17 UTC.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "SnapVRKA branch to inspect (empty = value from .snapvrka/upstream-sync.json)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: snapvrka-upstream-sync
  cancel-in-progress: false

jobs:
  detect:
    name: Detect and summarize upstream changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sync state and protected paths
        id: state
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh
          .github/scripts/verify-snapvrka-identity.sh

          UPSTREAM_REPO="$(.github/scripts/sync-state.sh get upstreamRepository)"
          UPSTREAM_BRANCH="$(.github/scripts/sync-state.sh get upstreamBranch)"
          TARGET_BRANCH="$(.github/scripts/sync-state.sh get targetBranch)"
          LAST_SYNCED="$(.github/scripts/sync-state.sh get lastSyncedCommit)"

          if [ -n "${{ inputs.target_branch }}" ]; then
            TARGET_BRANCH="${{ inputs.target_branch }}"
          fi
          if [ -z "$UPSTREAM_REPO" ] || [ -z "$UPSTREAM_BRANCH" ] || [ -z "$TARGET_BRANCH" ] || [ -z "$LAST_SYNCED" ]; then
            echo "::error::Incomplete sync state in .snapvrka/upstream-sync.json"
            exit 1
          fi

          {
            echo "upstream_repo=$UPSTREAM_REPO"
            echo "upstream_branch=$UPSTREAM_BRANCH"
            echo "target_branch=$TARGET_BRANCH"
            echo "last_synced=$LAST_SYNCED"
          } >> "$GITHUB_OUTPUT"

      - name: Detect upstream changes without merging
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ steps.state.outputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ steps.state.outputs.upstream_branch }}
          TARGET_BRANCH: ${{ steps.state.outputs.target_branch }}
          LAST_SYNCED: ${{ steps.state.outputs.last_synced }}
        run: |
          set -euo pipefail

          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          BEFORE_STATE="$(sha256sum .snapvrka/upstream-sync.json | awk '{print $1}')"
          BEFORE_HEAD="$(git rev-parse HEAD)"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"

          LATEST_RELEASE_TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")"
          LATEST_RELEASE_DATE="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.published_at' 2>/dev/null || echo "")"
          NEW_COMMITS="$(git rev-list --count "${LAST_SYNCED}..${UPSTREAM_SHA}" 2>/dev/null || echo 0)"

          if [ "$UPSTREAM_SHA" = "$LAST_SYNCED" ]; then
            HAS_UPDATE="false"
            REASON="upstream is unchanged since the last successful sync"
          else
            HAS_UPDATE="true"
            REASON="new upstream commits detected; review required before any merge"
          fi

          mkdir -p upstream-report
          {
            echo "# تقرير مزامنة upstream"
            echo
            echo "اكتُشفت الحالة فقط. لم يُدمج شيء، ولم يُرفع شيء، ولم يُبنَ APK، ولم يُنشر Release."
            echo
            echo "| الحقل | القيمة |"
            echo "| --- | --- |"
            echo "| المستودع الأصلي | \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` |"
            echo "| رأس upstream | \`${UPSTREAM_SHA}\` |"
            echo "| آخر مزامنة ناجحة | \`${LAST_SYNCED}\` |"
            echo "| فرع SnapVRKA | \`${TARGET_BRANCH}\` |"
            echo "| آخر إصدار أصلي | \`${LATEST_RELEASE_TAG:-غير معروف}\` ${LATEST_RELEASE_DATE:+($LATEST_RELEASE_DATE)} |"
            echo "| Commits جديدة | ${NEW_COMMITS} |"
            echo "| يوجد تحديث | ${HAS_UPDATE} |"
            echo "| السبب | ${REASON} |"
            echo
            echo "## ملخص التغييرات"
            echo
            if [ "$HAS_UPDATE" = "true" ]; then
              git log --no-merges --pretty=format:'- `%h` %s' "${LAST_SYNCED}..${UPSTREAM_SHA}" || true
              echo
              echo
              echo "## الملفات المتأثرة"
              echo
              git diff --name-status "${LAST_SYNCED}..${UPSTREAM_SHA}" || true
            else
              echo "لا توجد commits جديدة منذ آخر مزامنة ناجحة."
            fi
            echo
            echo "## قرار الدمج"
            echo
            echo "إعادة هيكلة VRKA 5.0.2 غير معتمدة للدمج التلقائي: يحافظ SnapVRKA على Puemos وConcurrentTransferEngine ومحركه الحالي."
          } > upstream-report/upstream-summary.md

          AFTER_STATE="$(sha256sum .snapvrka/upstream-sync.json | awk '{print $1}')"
          AFTER_HEAD="$(git rev-parse HEAD)"
          if [ "$BEFORE_STATE" != "$AFTER_STATE" ] || [ "$BEFORE_HEAD" != "$AFTER_HEAD" ]; then
            echo "::error::Detection changed SnapVRKA state; refusing to continue."
            exit 1
          fi
          if ! git diff --exit-code -- .snapvrka/upstream-sync.json > /dev/null; then
            echo "::error::lastSyncedCommit must not change during detection."
            exit 1
          fi

          {
            echo "has_update=$HAS_UPDATE"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "latest_release_tag=$LATEST_RELEASE_TAG"
            echo "new_commits=$NEW_COMMITS"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the detection report
        uses: actions/upload-artifact@v4
        with:
          name: snapvrka-upstream-summary
          path: upstream-report/upstream-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## اكتشاف upstream فقط"
            echo
            echo "لا يوجد دمج أو دفع أو بناء أو Release من هذا التشغيل."
            echo
            echo "| الحقل | القيمة |"
            echo "| --- | --- |"
            echo "| Upstream | \`${{ steps.state.outputs.upstream_repo }}@${{ steps.state.outputs.upstream_branch }}\` |"
            echo "| Commit | \`${{ steps.upstream.outputs.upstream_sha }}\` |"
            echo "| Commits جديدة | ${{ steps.upstream.outputs.new_commits }} |"
            echo "| تحديث مكتشف | ${{ steps.upstream.outputs.has_update }} |"
            echo "| السبب | ${{ steps.upstream.outputs.reason }} |"
            echo "| مؤشر المزامنة | بقي عند \`${{ steps.state.outputs.last_synced }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
