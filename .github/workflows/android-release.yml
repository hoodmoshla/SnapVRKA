name: Android Release

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: snapvrka-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- build
  build:
    name: Build, test and verify SnapVRKA
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Provide release signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SNAPVRKA_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SNAPVRKA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNAPVRKA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNAPVRKA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.snapvrka-signing"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Signing secrets detected."
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.snapvrka-signing/snapvrka-release.keystore"
            cat > "$HOME/.snapvrka-signing/signing.properties" <<EOF
          storeFile=$HOME/.snapvrka-signing/snapvrka-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            chmod 600 "$HOME/.snapvrka-signing/signing.properties"
            echo "VRKA_SIGNING_PROPERTIES=$HOME/.snapvrka-signing/signing.properties" >> "$GITHUB_ENV"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are not configured. Release APK will be skipped."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # AGP 9 removed lintVitalRelease; lintRelease is the release-variant lint task.
      # The module sets abortOnError=false, so warnings never block the release.
      - name: Lint (release variant)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Assemble APK
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "Signing material detected: building the signed release APK."
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "::warning::Release signing secrets are not configured, so a signed release APK cannot be produced. Falling back to the debug variant so this workflow still uploads an installable APK."
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Collect and verify the APK Gradle produced
        id: apk
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)"
          AAPT2="$(ls "$SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort | tail -1)"

          if [ "$HAS_SIGNING" = "true" ]; then
            VARIANT_DIR="app/build/outputs/apk/release"
            APK_NAME="SnapVRKA-v1.0.0.apk"
          else
            VARIANT_DIR="app/build/outputs/apk/debug"
            APK_NAME="SnapVRKA-v1.0.0-debug.apk"
          fi

          # Capture the APK Gradle actually produced (never a hard-coded file name).
          SRC="$(find "$VARIANT_DIR" -maxdepth 1 -type f -name '*.apk' 2>/dev/null | head -1)"
          if [ -z "$SRC" ]; then
            SRC="$(find app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | head -1)"
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::Gradle produced no APK under app/build/outputs/apk"
            find app/build/outputs -type f 2>/dev/null | head -50 || true
            exit 1
          fi

          mkdir -p artifacts
          rm -f artifacts/*.apk artifacts/*.apk.sha256
          cp "$SRC" "artifacts/$APK_NAME"
          echo "Collected  : $SRC"
          echo "Artifact APK: artifacts/$APK_NAME"
          echo "APK size    : $(stat -c%s "artifacts/$APK_NAME") bytes"

          cd artifacts
          "$AAPT2" dump badging "$APK_NAME" > badging.txt
          grep -E "^package:" badging.txt
          grep -E "^application-label:|^application-debuggable" badging.txt || true

          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apksigner.txt

          if [ "$HAS_SIGNING" = "true" ]; then
            grep -q "^package: name='com.hoodmoshla.snapvrka' versionCode='10000' versionName='1.0.0'" badging.txt
            echo "Verified applicationId/versionName/versionCode for the signed release APK."
          fi

          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload the SnapVRKA APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapVRKA-release-apk
          path: |
            artifacts/*.apk
            artifacts/*.apk.sha256
            artifacts/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnapVRKA-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- release
  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: SnapVRKA-release-apk
          path: artifacts

      - name: Ensure signed APK is present
        run: |
          set -euo pipefail
          if [ ! -f artifacts/SnapVRKA-v1.0.0.apk ]; then
            echo "::error::Signed release APK is missing; refusing to publish a release."
            exit 1
          fi
          ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: SnapVRKA ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/SnapVRKA-v1.0.0.apk
            artifacts/SnapVRKA-v1.0.0.apk.sha256
